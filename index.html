<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Shree Krishna, Bhumi! 🌺</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #ffeef2; 
            --pink-accent: #ff85a2; 
            --dark-pink: #d94a6e; 
            --card-bg: #ffffff; 
            --text-color: #5c3a41; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            overflow-x: hidden; 
            cursor: pointer;
        }

        /* 💖 Magic Cursor Trail 💖 */
        .cursor-heart { position: fixed; pointer-events: none; font-size: 20px; animation: floatFade 1s forwards; z-index: 9999; }
        @keyframes floatFade { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(0.5); opacity: 0; } }

        /* 🌺 SHREENATHJI BACKGROUND (FIRST SLIDE ONLY) 🌺 */
        #entry-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            /* Pulling your specific file from the repository */
            background: linear-gradient(rgba(255, 236, 240, 0.4), rgba(255, 236, 240, 0.4)), url('shreenathji.jpg.png');
            background-size: cover;
            background-position: center;
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 1000; 
            transition: opacity 1.5s ease-in-out; 
        }

        h1 { 
            font-family: 'Mali', cursive; 
            color: white; 
            font-size: 2.8rem; 
            text-align: center; 
            text-shadow: 2px 2px 10px rgba(217, 74, 110, 0.8); /* Glow for visibility */
            margin-bottom: 20px;
        }
        
        .start-btn { 
            background: var(--pink-accent); color: white; border: none; 
            padding: 15px 40px; font-family: 'Mali', cursive; font-size: 1.5rem; 
            border-radius: 50px; cursor: pointer; 
            box-shadow: 0 8px 0 #d94a6e; transition: 0.1s; 
        }
        .start-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #d94a6e; }

        /* 🐼 MAIN CONTENT (BUBU WORLD) 🐼 */
        #main-content { 
            display: none; max-width: 600px; margin: 0 auto; padding: 40px 20px; padding-bottom: 100px;
            background-image: radial-gradient(#ffd1dc 2px, transparent 2px);
            background-size: 30px 30px;
        }
        
        .cute-card { 
            background: var(--card-bg); border-radius: 40px; padding: 30px; 
            text-align: center; margin-bottom: 50px; border: 4px solid #ffe1e8; 
            box-shadow: 0 20px 40px rgba(255, 133, 162, 0.15); position: relative; 
        }
        
        .section-gif { width: 160px; margin-top: -80px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }
        h2 { font-family: 'Mali', cursive; color: var(--dark-pink); font-size: 1.8rem; margin: 15px 0; }
        
        .polaroid-container { display: flex; flex-direction: column; gap: 40px; margin-top: 20px; align-items: center; }
        .polaroid { background: white; padding: 15px 15px 25px 15px; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 85%; transform: rotate(-3deg); transition: 0.3s; }
        .polaroid img { width: 100%; border-radius: 5px; }
        .caption { font-family: 'Mali', cursive; color: var(--dark-pink); margin-top: 15px; font-size: 1.2rem; font-weight: bold; }
        
        .letter-box { background: #fff0f3; padding: 20px; border-radius: 20px; font-family: 'Mali', cursive; font-size: 1.1rem; text-align: left; line-height: 1.6; border: 2px dashed var(--pink-accent); min-height: 250px; }
        .cake-emoji { font-size: 100px; animation: gentleBounce 2s infinite; cursor: pointer; }
        @keyframes gentleBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

<audio id="bday-music">
    <source src="birthday_song.mp3.mp3" type="audio/mpeg">
</audio>

<audio id="memory-music" loop>
    <source src="memory_song.mp3" type="audio/mpeg">
</audio>

<div id="entry-screen">
    <h1>jai shree krishna babe</h1>
    <button class="start-btn" onclick="enterBubuWorld()">click here babyy</button>
</div>

<div id="main-content">
    <div class="cute-card">
        <img src="https://media.tenor.com/zWz2x4nZ6gYAAAAj/bubu-bubu-dudu.gif" class="section-gif">
        <h2>Only for sirf aur sirf mera teddybear 💌</h2>
        <div class="letter-box" id="love-letter"></div>
    </div>

    <div class="cute-card">
        <img src="https://media.tenor.com/2s_X9_B2q0gAAAAj/bubu-dudu-love.gif" class="section-gif">
        <h2>Our Scrapbook 📸</h2>
        <div class="polaroid-container">
            <div class="polaroid"><img src="2026-05-06_21-50-54_337.png"><p class="caption">The first time my heart skipped a beat. ✨</p></div>
            <div class="polaroid"><img src="2026-05-06_21-50-54_445.jpg"><p class="caption">Every smile of yours is a treasure. 💕</p></div>
            <div class="polaroid"><img src="2026-05-06_21-50-54_563.jpg"><p class="caption">To many more years together. 🐻</p></div>
            <div class="polaroid"><img src="2026-05-06_21-50-54_575.jpg"><p class="caption">My forever and always. 🐼</p></div>
        </div>
    </div>

    <div class="cute-card">
        <img src="https://media.tenor.com/lZJtL-fN58UAAAAj/bubu-dudu.gif" class="section-gif">
        <h2>Happy 18th! 🎉</h2>
        <div class="cake-emoji" id="cake" onclick="blowCandles()">🎂</div>
        <h3 id="wish-text" style="display: none; color: var(--pink-accent); font-family: 'Mali'; margin-top: 20px;">May Krishna always keep us together! ✨</h3>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.8) { 
            const heart = document.createElement('div');
            heart.innerHTML = '💖'; heart.className = 'cursor-heart';
            heart.style.left = e.pageX + 'px'; heart.style.top = e.pageY + 'px';
            document.body.appendChild(heart); setTimeout(() => heart.remove(), 1000);
        }
    });

    const bdayAudio = document.getElementById('bday-music');
    const memoryAudio = document.getElementById('memory-music');

    bdayAudio.onended = function() {
        memoryAudio.play();
    };

    function enterBubuWorld() {
        bdayAudio.play();
        memoryAudio.play().then(() => { memoryAudio.pause(); }).catch(e => console.log(e));
        
        document.getElementById('entry-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            typeWriter();
        }, 1000);
    }

    const textToType = "Happy birthday, meri sweetie! Nunu loves you more than anything. Ever since you came into my life, everything seems to have a meaning. My heartbeat now has a name to say with each beat. May Krishna always keep us together (I know He will). Bubu, I can't express how much I love you. This is your first birthday with me, and there are so many more to come. I'll do anything just to see you smile. I miss you so much!";
    let i = 0;
    function typeWriter() {
        if (i < textToType.length) {
            document.getElementById("love-letter").innerHTML += textToType.charAt(i);
            i++; setTimeout(typeWriter, 45); 
        }
    }

    function blowCandles() {
        document.getElementById('cake').innerHTML = '🍰';
        document.getElementById('wish-text').style.display = 'block';
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }
</script>
</body>
</html>
