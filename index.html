<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 18th, Bhumi! 🐻🐼</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffeef2;
            --pink-accent: #ff85a2;
            --dark-pink: #d94a6e;
            --card-bg: #ffffff;
            --text-color: #5c3a41;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            overflow-x: hidden; 
            cursor: pointer;
            background-image: radial-gradient(#ffd1dc 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* 💖 Magic Cursor Trail 💖 */
        .cursor-heart {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            animation: floatFade 1s forwards;
            z-index: 9999;
        }
        @keyframes floatFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(0.5); opacity: 0; }
        }

        /* 🌺 Shrinathji Entry Screen 🌺 */
        #entry-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: #ffecf0; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 1.5s ease-in-out;
        }
        
        .shrinathji-img { 
            width: 320px; 
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 70%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 70%);
            animation: divineGlow 3s infinite alternate; 
            margin-bottom: 10px;
        }
        @keyframes divineGlow { 
            0% { filter: drop-shadow(0 0 15px rgba(255, 133, 162, 0.4)); transform: scale(1); } 
            100% { filter: drop-shadow(0 0 30px rgba(255, 133, 162, 0.8)); transform: scale(1.02); } 
        }
        
        h1 { font-family: 'Mali', cursive; color: var(--dark-pink); font-size: 3rem; text-align: center; margin-top: 0; }
        
        .start-btn {
            background: var(--pink-accent); color: white; border: none; 
            padding: 15px 40px; font-family: 'Mali', cursive; font-size: 1.5rem; 
            border-radius: 50px; margin-top: 20px; cursor: pointer;
            box-shadow: 0 8px 0 #d94a6e; transition: 0.1s;
        }
        .start-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #d94a6e; }
