<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Shree Krishna, Bhumi! 🌺</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #ffeef2; 
            --pink-accent: #ff85a2; 
            --dark-pink: #d94a6e; 
            --card-bg: rgba(255, 255, 255, 0.85); 
            --text-color: #5c3a41; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            overflow-x: hidden; 
            cursor: pointer;
            -webkit-font-smoothing: antialiased;
        }

        body.locked { overflow-y: hidden !important; touch-action: none; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #ffe1e8; }
        ::-webkit-scrollbar-thumb { background: var(--pink-accent); border-radius: 10px; }

        .floating-heart {
            position: fixed; pointer-events: none; z-index: 9998; 
            animation: floatUp 5s linear infinite; opacity: 0.9;
            filter: drop-shadow(0 0 5px rgba(255, 133, 162, 0.6));
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        .cursor-heart { position: fixed; pointer-events: none; font-size: 20px; animation: floatFade 1s forwards; z-index: 9999; }
        @keyframes floatFade { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(0.5); opacity: 0; } }

        #entry-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('shreenathji.jpg.png');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 1000; transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        h1 { 
            font-family: 'Mali', cursive; color: white; font-size: 2.8rem; text-align: center; 
            text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.8); margin-bottom: 20px; letter-spacing: 1px;
        }
        
        .start-btn { 
            background: linear-gradient(135deg, #ff9aae, #ff7193); color: white; border: none; 
            padding: 18px 45px; font-family: 'Mali', cursive; font-size: 1.6rem; 
            border-radius: 50px; cursor: pointer; 
            box-shadow: 0 8px 15px rgba(217, 74, 110, 0.4), 0 8px 0 #d94a6e; 
            transition: all 0.2s ease; animation: pulseHeart 2.5s infinite;
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); box-shadow: 0 8px 15px rgba(217, 74, 110, 0.4), 0 8px 0 #d94a6e; }
            50% { transform: scale(1.04); box-shadow: 0 15px 25px rgba(217, 74, 110, 0.6), 0 8px 0 #d94a6e; }
            100% { transform: scale(1); box-shadow: 0 8px 15px rgba(217, 74, 110, 0.4), 0 8px 0 #d94a6e; }
        }

        #main-content { 
            display: none; max-width: 600px; margin: 0 auto; padding: 40px 20px; padding-bottom: 100px;
            position: relative; z-index: 2;
            background-image: radial-gradient(#ffd1dc 2px, transparent 2px); background-size: 30px 30px;
        }
        
        .cute-card { 
            background: var(--card-bg); border-radius: 40px; padding: 35px 30px; 
            text-align: center; margin-bottom: 60px; border: 2px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 25px 50px rgba(255, 133, 162, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.8); 
            position: relative; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        
        .section-gif { width: 160px; margin-top: -85px; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.15)); }
        
        .letter-box { 
            background: rgba(255, 240, 243, 0.95); padding: 25px; border-radius: 25px; 
            font-family: 'Mali', cursive; font-size: 1.15rem; text-align: left; line-height: 1.8; 
            border: 2px dashed var(--pink-accent); min-height: 250px; 
            animation: gentleGlow 3s infinite alternate;
        }

        @keyframes gentleGlow {
            0% { box-shadow: 0 0 10px rgba(255, 133, 162, 0.2); }
            100% { box-shadow: 0 0 25px rgba(255, 133, 162, 0.6); }
        }
        
        .polaroid-container { display: flex; flex-direction: column; gap: 50px; margin-top: 20px; align-items: center; }
        
        .polaroid { 
            background: white; padding: 15px 15px 25px 15px; border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 90%; 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; opacity: 0; transform: translateY(40px) scale(0.9);
        }

        .polaroid.visible { opacity: 1; transform: translateY(0) scale(1) rotate(-3deg); }
        .polaroid.visible:nth-child(even) { transform: translateY(0) scale(1) rotate(3deg); }
        .polaroid:hover.visible { transform: scale(1.08) rotate(0deg) !important; box-shadow: 0 20px 40px rgba(217, 74, 110, 0.25); z-index: 10; }
        .polaroid img { width: 100%; border-radius: 6px; }
        .caption { font-family: 'Mali', cursive; color: var(--dark-pink); margin-top: 15px; font-size: 1.15rem; font-weight: bold; }
        
        .cake-emoji { font-size: 160px; animation: gentleBounce 2s infinite; cursor: pointer; transition: 0.3s; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)); }
        .cake-emoji:hover { transform: scale(1.15) rotate(-5deg); }
        @keyframes gentleBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
